[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distinct-paths-to-false-memory"
version = "0.1.0"
description = "A project exploring distinct paths to false memory"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "tiktoken>=0.4.0,<1.0.0",
    "langchain>=0.0.316,<0.1.0",
    "openai>=1.0.0,<2.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "transformers>=4.20.0,<5.0.0",
    "torch>=1.12.0,<2.3.0",
    "scikit-learn>=1.1.0,<2.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0",
    "scipy>=1.9.0,<2.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "xlsxwriter>=3.0.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["semantic_features"]
